[build]
  publish = "site"

[[redirects]]
  from   = "http://assisxavier.com.br/*"
  to     = "https://assisxavier.com.br/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.assisxavier.com.br/*"
  to     = "https://assisxavier.com.br/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.assisxavier.com.br/*"
  to     = "https://assisxavier.com.br/:splat"
  status = 301
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
